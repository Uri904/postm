spring.application.name=proyecto-musica
server.address=0.0.0.0
spring.datasource.url=jdbc:h2:file:./data/musica;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
app.privacy.contact-email=${PRIVACY_CONTACT_EMAIL:}
app.security.jwt.secret=${JWT_SECRET:}
app.security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
